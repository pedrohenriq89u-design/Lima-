<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
</head>
<body>
    
                        <!-- Tabelas HTML -->

    <table border="1">               <!--Estrutura de Tabelas-->             

        <thead> <!-- Cabeçalho da tabela -->
            <tr> <!-- Linha do cabeçalho -->

            <th>Posição</th>
            <th>Piloto</th>
            <th>Pontos</th>
            <th>Vitórias</th>
            <th>Pódios</th>
            </tr>
        </thead>

        <tbody> <!-- Corpo da tabela -->
          <tr> <!-- Linha do corpo -->
            <td>1</td> <!--Dado da tabela-->
            <td>A. Antonelli</td>
            <td>292</td>
            <td>8</td>
            <td>12</td>
          </tr>

          <tr>
            <td>2</td>
            <td>G. Russel</td>
            <td>211</td>
            <td>2</td>
            <td>7</td>
          </tr>
        </tbody>

    </table>

</body>
</html>
